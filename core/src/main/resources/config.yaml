# TST Assist — Model configuration (plan §5)
# ==========================================
#
# Same shape as TST Desk's core/tstd/config.yaml, so a preset copies between the two
# files unchanged. Slugs, prices and URLs live here, never in Kotlin.
#
# A tier has:
#   slug             — model identifier. Optional only for a loopback base_url, where the
#                      model is discovered from the endpoint's /v1/models. Required
#                      anywhere else, device:// included.
#   base_url         — OpenAI-compatible endpoint, or device://<runtime> for on-device
#   input_price      — $ per million prompt tokens
#   output_price     — $ per million completion tokens
#   cache_read_price — $ per million prompt tokens the provider reported as cache reads
#   context_window   — max context tokens the model supports
#   max_output_tokens — max tokens the model may generate
#   credential       — named key; the secret is in the Keystore-backed SecretStore under
#                      tst-<credential>. Omit on a loopback tier for no key; an off-box
#                      tier with no credential uses `openrouter`.
#
# spend_cap_usd — session spend at which the loop pauses. Omit for no cap.

preset: tst-default

credentials:
  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
  ezer:
    name: EZER

presets:
  # ── tst-default, budget, local, vllm ──────────────────────────────
  # Copied from TST Desk core/tstd/config.yaml: same slugs, same prices, same URLs.
  # The desktop file is the source of truth for these four; update there, then here.
  tst-default:
    brain:
      slug: moonshotai/kimi-k3
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 2.80
      output_price: 14.00
      cache_read_price: 0.30
      context_window: 1000000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # Cheaper brain (GLM-5.2), same worker and validator.
  budget:
    brain:
      slug: z-ai/glm-5.2
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.15
      output_price: 0.60
      cache_read_price: 0.015
      context_window: 128000
      max_output_tokens: 8192
    worker:
      slug: deepseek/deepseek-v4-flash
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.07
      output_price: 0.17
      cache_read_price: 0.07
      context_window: 128000
      max_output_tokens: 16384
    validator:
      slug: deepseek/deepseek-v4-pro
      base_url: https://openrouter.ai/api/v1
      credential: openrouter
      input_price: 0.44
      output_price: 0.87
      cache_read_price: 0.44
      context_window: 128000
      max_output_tokens: 8192

  # Zero-cost models on loopback (Ollama's default port). No slug on purpose: the model is
  # read from /v1/models on first use. context_window is a compaction budget and must not
  # exceed what the server actually serves.
  local:
    brain:
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      base_url: http://127.0.0.1:11434/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

  # Zero-cost models on loopback (vLLM's default port). Same notes as `local`.
  vllm:
    brain:
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      base_url: http://127.0.0.1:8000/v1
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

  # ── device ────────────────────────────────────────────────────────
  # The on-device brain (plan §3, Device mode): Gemma 4 E4B through LiteRT-LM. $0.00 and
  # the meter means it. No socket, no host, works with no network at all.
  device:
    brain:
      slug: gemma-4-e4b
      base_url: device://litert-lm
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      slug: gemma-4-e4b
      base_url: device://litert-lm
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      slug: gemma-4-e4b
      base_url: device://litert-lm
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096

  # ── home ──────────────────────────────────────────────────────────
  # EZER's box over Tailscale (plan §3). Default is the LiteLLM front on
  # llm.ezer-server.ts.net serving ezer-chat. This is the OpenAI-compat
  # home-direct path (TM-010), not tstd's WebSocket. Off box, so a slug
  # is required. $0.00 — the box meters itself.
  home:
    brain:
      slug: ezer-chat
      base_url: https://llm.ezer-server.ts.net/v1
      credential: ezer
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    worker:
      slug: ezer-chat
      base_url: https://llm.ezer-server.ts.net/v1
      credential: ezer
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
    validator:
      slug: ezer-chat
      base_url: https://llm.ezer-server.ts.net/v1
      credential: ezer
      input_price: 0.0
      output_price: 0.0
      cache_read_price: 0.0
      context_window: 32768
      max_output_tokens: 4096
